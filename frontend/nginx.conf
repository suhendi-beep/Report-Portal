server {
    listen 80;

    # Docker's embedded DNS server. Using a variable (below) instead of a
    # bare hostname in proxy_pass forces nginx to re-resolve "backend" on
    # this TTL, instead of caching the IP forever from container startup.
    # Without this, recreating the backend container (new IP) leaves nginx
    # pointing at the old, now-dead IP until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
