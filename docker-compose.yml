services:

  backend:
    # `image:` names the build output. `worker` below reuses this exact
    # image instead of building an identical ~2.8GB image a second time
    # under a different tag — same Dockerfile, same content, half the disk.
    build: ./backend
    image: automation-hub-backend:latest
    ports: ["5000:5000"]
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    networks: [hub-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 96M

  worker:
    # Reuses the backend image built above (identical Dockerfile) —
    # only the startup command differs. Run `docker compose build backend`
    # then `docker compose up -d backend worker` to pick up changes.
    image: automation-hub-backend:latest
    depends_on: [backend]
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=1
    restart: always
    volumes:
      - ./shared:/app/shared
      - ./oci_config:/root/.oci:ro
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Jakarta
    networks: [hub-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        # Chromium/Grafana screenshot capture was nearly maxing the old 512M
        # limit (observed ~511MB in production), which throttles/slows the
        # task instead of erroring outright. Host has headroom for this.
        limits:
          cpus: "0.8"
          memory: 896M
        reservations:
          cpus: "0.05"
          memory: 128M

  frontend:
    build: ./frontend
    ports: ["3005:80"]
    restart: always
    depends_on: [backend]
    networks: [hub-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 32M

networks:
  hub-net:
    driver: bridge
